warn.dshNotStarted=dsh is not running, port {0} is not ready.\nPlease click Start first.

notify.fail.title=Dsh failed to start
notify.fail.nodeMissing.wsl=No Node.js environment detected (node / npm / npx unavailable), cannot start dsh.\nPlease install Node.js in WSL (nvm recommended) and click Start again.\nSee the log panel at the bottom of the tool window for details.
notify.fail.nodeMissing.windows=No Node.js environment detected (node / npm / npx unavailable), cannot start dsh.\nPlease install Node.js (https://nodejs.org/), reopen the terminal, and click Start again.\nSee the log panel at the bottom of the tool window for details.
notify.fail.dshMissing.wsl=The dsh command was not found; the plugin will fall back to the official launcher: npx @deepseek-ai/dsh web.\nIf npx is unavailable too, run in the WSL terminal: npm i -g @deepseek-ai/dsh\nRestart IDEA after installing. See the log panel at the bottom of the tool window for details.
notify.fail.dshMissing.windows=The dsh command was not found; the plugin will fall back to the official launcher: npx @deepseek-ai/dsh web.\nIf npx is unavailable too, run on Windows: npm i -g @deepseek-ai/dsh\nRestart IDEA after installing. See the log panel at the bottom of the tool window for details.
notify.fail.wslError=WSL startup failed (Wsl/Service/E_UNEXPECTED or similar subsystem error).\nRun wsl --shutdown on Windows and retry;\nif it still fails, restart the WSL service (admin PowerShell: net stop LxssManager && net start LxssManager).
notify.fail.generic.wsl=dsh failed to start, port {0} is not ready.\nIf the log contains WSL errors (e.g. Wsl/Service/E_UNEXPECTED), run wsl --shutdown on Windows and retry;\nif it still fails, restart the WSL service (admin PowerShell: net stop LxssManager && net start LxssManager).\nSee the log panel at the bottom of the tool window for details.
notify.fail.generic.windows=dsh failed to start, port {0} is not ready.\nSee the log panel at the bottom of the tool window for details.


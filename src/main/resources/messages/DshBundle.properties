plugin.name=Dsh Dock
plugin.description=IntelliJ IDEA plugin: click the dsh whale icon to run DeepSeek Harness in WSL and open its WebUI in a side tool window.

cn.codecrab.plugins.dsh.OpenDshToolWindowAction.action.text=Open Dsh Dock
cn.codecrab.plugins.dsh.OpenDshToolWindowAction.action.description=Open the Dsh tool window in the sidebar, run dsh web, and show its WebUI
cn.codecrab.plugins.dsh.SendSelectionToDshAction.action.text=Send Selected Code to Dsh Dock
cn.codecrab.plugins.dsh.SendSelectionToDshAction.action.description=Send the @path#Lline reference of the selected code to the Dsh Dock input field
cn.codecrab.plugins.dsh.SendFileToDshAction.action.text=Send File Path to Dsh Dock
cn.codecrab.plugins.dsh.SendFileToDshAction.action.description=Send the file path reference to the Dsh Dock input field
cn.codecrab.plugins.dsh.CopySelectionReferenceAction.action.text=Copy AI Reference
cn.codecrab.plugins.dsh.CopySelectionReferenceAction.action.description=Copy the @path#Lline AI reference of the selected code to the clipboard
cn.codecrab.plugins.dsh.CopyFileReferenceAction.action.text=Copy AI Reference
cn.codecrab.plugins.dsh.CopyFileReferenceAction.action.description=Copy the AI reference of the selected file/folder to the clipboard


settings.autoStartMode.label=自动启动:
settings.autoStartMode.tooltip.ideStartup=IDE 启动即在后台启动 dsh 并预热内嵌浏览器页面，首次打开 Dsh Dock 窗口无需等待；打开窗口时若 dsh 未运行也会自动启动。IDE 退出时 dsh 一并自动停止。
settings.autoStartMode.tooltip.toolWindow=仅打开 Dsh Dock 窗口时才启动 dsh，不做启动预热。IDE 退出时 dsh 一并自动停止。

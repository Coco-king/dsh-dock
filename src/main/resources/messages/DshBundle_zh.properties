warn.dshNotStarted=dsh 尚未启动, 端口 {0} 未就绪。\n请先点击「启动」。

notify.fail.title=Dsh 启动失败
notify.fail.nodeMissing.wsl=未检测到 Node.js 环境（node / npm / npx 均不可用），无法启动 dsh。\n请在 WSL 中安装 Node.js（建议使用 nvm），安装完成后重新点击「启动」。\n详细日志见工具窗口底部日志面板。
notify.fail.nodeMissing.windows=未检测到 Node.js 环境（node / npm / npx 均不可用），无法启动 dsh。\n请先安装 Node.js（https://nodejs.org/）并重新打开终端，然后重新点击「启动」。\n详细日志见工具窗口底部日志面板。
notify.fail.dshMissing.wsl=未检测到 dsh 命令, 插件会自动改用官方启动命令 npx @deepseek-ai/dsh web。\n如果 npx 也无法使用, 请在 WSL 终端执行: npm i -g @deepseek-ai/dsh\n安装完成后请重启{0}。详细日志见工具窗口底部日志面板。
notify.fail.dshMissing.windows=未检测到 dsh 命令, 插件会自动改用官方启动命令 npx @deepseek-ai/dsh web。\n如果 npx 也无法使用, 请在 Windows 执行: npm i -g @deepseek-ai/dsh\n安装完成后请重启{0}。详细日志见工具窗口底部日志面板。
notify.fail.wslError=WSL 启动失败 (Wsl/Service/E_UNEXPECTED 等子系统错误)。\n请先在 Windows 运行 wsl --shutdown 后重试;\n仍失败可重启 WSL 服务 (管理员 PowerShell: net stop LxssManager && net start LxssManager)。
notify.fail.generic.wsl=dsh 启动失败, 端口 {0} 未就绪。\n若日志含 WSL 错误 (如 Wsl/Service/E_UNEXPECTED), 请先在 Windows 运行 wsl --shutdown 后重试;\n仍失败可重启 WSL 服务 (管理员 PowerShell: net stop LxssManager && net start LxssManager)。\n详细日志见工具窗口底部日志面板。
notify.fail.generic.windows=dsh 启动失败, 端口 {0} 未就绪。\n详细日志见工具窗口底部日志面板。

